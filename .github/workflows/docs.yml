name: Publish Docs (Dokka → GitHub Pages)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  actions: read # deploy-pages v4+ reads the Pages artifact through the Actions API
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-docs:
    name: Build Dokka site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # JDK 17 compiles the library (jvmToolchain(17)); JDK 21 runs the Gradle
      # daemon (gradle/gradle-daemon-jvm.properties). Register both with Gradle,
      # which does not scan the runner's tool cache, and fail fast unless it
      # detects both.
      - name: Set up JDK 17 and 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: |
            17
            21

      # Enhanced caching (the default provider) uses the gradle-actions-caching
      # component under Gradle's Terms of Use, accepted for this repo. Cache
      # writes happen on main only. Set up Gradle before the first ./gradlew
      # call so the wrapper checksum is validated first.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Register JDKs with Gradle
        run: |
          jdk17="${JAVA_HOME_17_X64:-$JAVA_HOME_17_ARM64}"
          jdk21="${JAVA_HOME_21_X64:-$JAVA_HOME_21_ARM64}"
          mkdir -p ~/.gradle
          echo "org.gradle.java.installations.paths=${jdk17},${jdk21}" >> ~/.gradle/gradle.properties
          ./gradlew -q javaToolchains --no-daemon | tee toolchains.txt
          grep -q "Language Version:   17" toolchains.txt
          grep -q "Language Version:   21" toolchains.txt
          rm toolchains.txt

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Generate Dokka HTML
        run: ./gradlew dokkaGenerate --no-daemon --stacktrace

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/dokka

  deploy:
    name: Deploy to GitHub Pages
    needs: build-docs
    # Publish only for a v* tag. A manual run builds and uploads the site
    # without deploying it.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
