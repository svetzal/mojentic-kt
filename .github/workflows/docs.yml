name: Publish Docs (Dokka → GitHub Pages)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-docs:
    name: Build Dokka site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # JDK 17 compiles the library (jvmToolchain(17)); JDK 21 runs the Gradle
      # daemon (gradle/gradle-daemon-jvm.properties). Register both with Gradle,
      # which does not scan the runner's tool cache, and fail fast unless it
      # detects both.
      - name: Set up JDK 17 and 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Register JDKs with Gradle
        run: |
          jdk17="${JAVA_HOME_17_X64:-$JAVA_HOME_17_ARM64}"
          jdk21="${JAVA_HOME_21_X64:-$JAVA_HOME_21_ARM64}"
          mkdir -p ~/.gradle
          echo "org.gradle.java.installations.paths=${jdk17},${jdk21}" >> ~/.gradle/gradle.properties
          ./gradlew -q javaToolchains --no-daemon | tee toolchains.txt
          grep -q "Language Version:   17" toolchains.txt
          grep -q "Language Version:   21" toolchains.txt
          rm toolchains.txt

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Dokka HTML
        run: ./gradlew dokkaGenerate --no-daemon --stacktrace

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/dokka/html

  deploy:
    name: Deploy to GitHub Pages
    needs: build-docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
