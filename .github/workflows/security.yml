name: Security (OWASP dependency-check)

on:
  schedule:
    # Mondays at 06:00 UTC — daily would chew through the NVD download
    # quota; weekly catches new CVEs without thrashing the cache.
    - cron: "0 6 * * 1"
  push:
    branches: ["main"]
    paths:
      - "gradle/libs.versions.toml"
      - "**/build.gradle.kts"
      - "dependency-check-suppressions.xml"
      - ".github/workflows/security.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-check:
    name: OWASP dependencyCheckAggregate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # JDK 17 compiles the library (jvmToolchain(17)); JDK 21 runs the Gradle
      # daemon (gradle/gradle-daemon-jvm.properties). Register both with Gradle,
      # which does not scan the runner's tool cache, and fail fast unless it
      # detects both.
      - name: Set up JDK 17 and 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: |
            17
            21

      # Enhanced caching (the default provider) uses the gradle-actions-caching
      # component under Gradle's Terms of Use, accepted for this repo. Cache
      # writes happen on main only. Set up Gradle before the first ./gradlew
      # call so the wrapper checksum is validated first.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Register JDKs with Gradle
        run: |
          jdk17="${JAVA_HOME_17_X64:-$JAVA_HOME_17_ARM64}"
          jdk21="${JAVA_HOME_21_X64:-$JAVA_HOME_21_ARM64}"
          mkdir -p ~/.gradle
          echo "org.gradle.java.installations.paths=${jdk17},${jdk21}" >> ~/.gradle/gradle.properties
          ./gradlew -q javaToolchains --no-daemon | tee toolchains.txt
          grep -q "Language Version:   17" toolchains.txt
          grep -q "Language Version:   21" toolchains.txt
          rm toolchains.txt

      - name: Cache NVD database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Outside the Gradle User Home, which setup-gradle alone caches.
          path: ~/.dependency-check-data
          # A new entry per run, restored from the newest, so the NVD data
          # refreshes incrementally.
          key: nvd-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            nvd-${{ runner.os }}-

      - name: Run dependencyCheckAggregate
        env:
          # NVD API key — request one at https://nvd.nist.gov/developers/request-an-api-key.
          # Without it, downloads are heavily rate-limited and the build can hang for hours.
          # The build script reads this directly from System.getenv("NVD_API_KEY").
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        # Without an API key, read NVD's bulk feed instead (see AGENTS.md,
        # "Dependency audit"). Same audit scope and threshold.
        run: |
          feed=()
          if [ -z "${NVD_API_KEY}" ]; then
            feed=("-PdependencyCheckNvdDatafeedUrl=https://nvd.nist.gov/feeds/json/cve/2.0/nvdcve-2.0-{0}.json.gz")
          fi
          ./gradlew dependencyCheckAggregate --no-parallel --no-daemon --stacktrace \
            "-PdependencyCheckDataDirectory=$HOME/.dependency-check-data" "${feed[@]}"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-check-report
          path: build/reports/dependency-check/
