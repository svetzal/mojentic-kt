name: Release (Maven Central)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Sign & publish to Sonatype Central Portal
    runs-on: macos-latest # macOS hosts can build the iOS targets in-process
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # JDK 17 compiles the library (jvmToolchain(17)); JDK 21 runs the Gradle
      # daemon (gradle/gradle-daemon-jvm.properties). Register both with Gradle,
      # which does not scan the runner's tool cache, and fail fast unless it
      # detects both.
      - name: Set up JDK 17 and 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: |
            17
            21

      # Enhanced caching (the default provider) uses the gradle-actions-caching
      # component under Gradle's Terms of Use, accepted for this repo. Cache
      # writes happen on main only. Set up Gradle before the first ./gradlew
      # call so the wrapper checksum is validated first.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Register JDKs with Gradle
        run: |
          jdk17="${JAVA_HOME_17_X64:-$JAVA_HOME_17_ARM64}"
          jdk21="${JAVA_HOME_21_X64:-$JAVA_HOME_21_ARM64}"
          mkdir -p ~/.gradle
          echo "org.gradle.java.installations.paths=${jdk17},${jdk21}" >> ~/.gradle/gradle.properties
          ./gradlew -q javaToolchains --no-daemon | tee toolchains.txt
          grep -q "Language Version:   17" toolchains.txt
          grep -q "Language Version:   21" toolchains.txt
          rm toolchains.txt

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Validate quality gate
        run: ./gradlew ktlintCheck detekt build allTests apiCheck --no-daemon --stacktrace

      # Publish only for a v* tag. A manual run stops after the quality gate.
      - name: Publish all artefacts
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          # Sonatype Central Portal credentials.
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          # GPG signing key, supplied as the armoured private key on a single line
          # with \n escaped. See
          # https://vanniktech.github.io/gradle-maven-publish-plugin/central/#in-memory-gpg-key
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew publishAndReleaseToMavenCentral --no-daemon --stacktrace
