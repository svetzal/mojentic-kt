name: Validate, Test, and Publish

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  release:
    types: [published]

permissions:
  contents: read
  id-token: write
  pages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-jvm-android:
    name: Build & Test (JVM + Android)
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'github-actions[bot]' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # JDK 17 compiles the library (jvmToolchain(17)); JDK 21 runs the Gradle
      # daemon (gradle/gradle-daemon-jvm.properties). Register both with Gradle,
      # which does not scan the runner's tool cache, and fail fast unless it
      # detects both.
      - name: Set up JDK 17 and 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: |
            17
            21

      # Enhanced caching (the default provider) uses the gradle-actions-caching
      # component under Gradle's Terms of Use, accepted for this repo. Cache
      # writes happen on main only. Set up Gradle before the first ./gradlew
      # call so the wrapper checksum is validated first.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Register JDKs with Gradle
        run: |
          jdk17="${JAVA_HOME_17_X64:-$JAVA_HOME_17_ARM64}"
          jdk21="${JAVA_HOME_21_X64:-$JAVA_HOME_21_ARM64}"
          mkdir -p ~/.gradle
          echo "org.gradle.java.installations.paths=${jdk17},${jdk21}" >> ~/.gradle/gradle.properties
          ./gradlew -q javaToolchains --no-daemon | tee toolchains.txt
          grep -q "Language Version:   17" toolchains.txt
          grep -q "Language Version:   21" toolchains.txt
          rm toolchains.txt

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: ktlint
        run: ./gradlew ktlintCheck --no-daemon --stacktrace

      - name: Detekt
        run: ./gradlew detekt --no-daemon --stacktrace

      - name: Build (JVM + Android)
        run: ./gradlew jvmJar assembleAndroidMain apiCheck --no-daemon --stacktrace

      - name: Test (JVM)
        run: ./gradlew jvmTest --no-daemon --stacktrace

      - name: Test (Android local unit tests)
        run: ./gradlew testAndroidHostTest --no-daemon --stacktrace

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jvm-android-reports
          path: |
            **/build/reports/
            **/build/test-results/

  build-ios:
    name: Build & Test (iOS)
    runs-on: macos-latest
    if: ${{ github.actor != 'github-actions[bot]' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # JDK 17 compiles the library (jvmToolchain(17)); JDK 21 runs the Gradle
      # daemon (gradle/gradle-daemon-jvm.properties). Register both with Gradle,
      # which does not scan the runner's tool cache, and fail fast unless it
      # detects both.
      - name: Set up JDK 17 and 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: |
            17
            21

      # Enhanced caching (the default provider) uses the gradle-actions-caching
      # component under Gradle's Terms of Use, accepted for this repo. Cache
      # writes happen on main only. Set up Gradle before the first ./gradlew
      # call so the wrapper checksum is validated first.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Register JDKs with Gradle
        run: |
          jdk17="${JAVA_HOME_17_X64:-$JAVA_HOME_17_ARM64}"
          jdk21="${JAVA_HOME_21_X64:-$JAVA_HOME_21_ARM64}"
          mkdir -p ~/.gradle
          echo "org.gradle.java.installations.paths=${jdk17},${jdk21}" >> ~/.gradle/gradle.properties
          ./gradlew -q javaToolchains --no-daemon | tee toolchains.txt
          grep -q "Language Version:   17" toolchains.txt
          grep -q "Language Version:   21" toolchains.txt
          rm toolchains.txt

      - name: Build iOS simulator (arm64)
        run: ./gradlew :mojentic-core:linkDebugFrameworkIosSimulatorArm64 --no-daemon --stacktrace

      - name: Test iOS simulator (arm64)
        run: ./gradlew :mojentic-core:iosSimulatorArm64Test --no-daemon --stacktrace

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-reports
          path: |
            **/build/reports/
            **/build/test-results/
